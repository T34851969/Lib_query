name: Lib_query Build & Selftest (self-hosted Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-selftest:
    runs-on: [self-hosted, libq]
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests
        shell: cmd
        run: scripts\ws2025-build.cmd test

      - name: Publish single-file exe
        shell: cmd
        run: scripts\ws2025-build.cmd publish

      - name: Smoke selftest
        shell: cmd
        run: scripts\ws2025-build.cmd selftest

      - name: 压缩发行包
        shell: pwsh
        run: Compress-Archive -Path dist\LibQuery.exe -DestinationPath LibQuery-windows-x64.zip

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibQuery-exe
          path: dist/LibQuery.exe
          retention-days: 14

      # 用户裁定：每次全绿构建直接转正为正式版（不打预备发行标签）——
      # 读取最新稳定 tag，patch 自动 +1，标记 Latest；手工 v* 标签（release.yml）仍可发任意版本。
      - name: 自动转正发行包（patch +1，Latest）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --limit 50 |
            ForEach-Object { ($_ -split "`t")[2] } |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.Substring(1) }
          $latest = $tags | Sort-Object | Select-Object -Last 1
          if ($null -eq $latest) { $latest = [version]'0.2.0' }
          $next = "v{0}.{1}.{2}" -f $latest.Major, $latest.Minor, ($latest.Build + 1)
          gh release create $next LibQuery-windows-x64.zip --latest --generate-notes `
            --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY --title $next
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::release $next 创建失败（可能并发已存在），本轮跳过"
            exit 0
          }
          Write-Host "released $next from $($env:GITHUB_SHA)"
