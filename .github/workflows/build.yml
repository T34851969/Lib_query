name: Lib_query Build & Selftest (self-hosted Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-selftest:
    runs-on: [self-hosted, libq]
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests
        shell: cmd
        run: scripts\ws2025-build.cmd test

      - name: Publish single-file exe
        shell: cmd
        run: scripts\ws2025-build.cmd publish

      - name: Smoke selftest
        shell: cmd
        run: scripts\ws2025-build.cmd selftest

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibQuery-exe
          path: dist/LibQuery.exe
          retention-days: 14
