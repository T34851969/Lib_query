name: Release (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04  # 较旧 glibc，兼顾更多目标发行版
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Qt 运行库（构建期导入 PySide6 所需）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller --clean --noconfirm --name Lib_query main.py

      - name: 冒烟自检（SQLite FTS5 + GUI 依赖）
        run: |
          ./dist/Lib_query/Lib_query --selfcheck
          cat selfcheck_result.txt

      - name: 压缩发行包
        run: tar -czf Lib_query-linux-x64.tar.gz -C dist Lib_query

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Lib_query-linux-x64
          path: Lib_query-linux-x64.tar.gz

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Lib_query-linux-x64.tar.gz
          generate_release_notes: true
