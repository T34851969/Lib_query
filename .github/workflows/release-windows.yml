name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller --clean --noconfirm --windowed --name Lib_query main.py

      - name: 冒烟自检（SQLite FTS5 + GUI 依赖）
        run: |
          dist\Lib_query\Lib_query.exe --selfcheck
          $code = $LASTEXITCODE
          Get-Content selfcheck_result.txt
          # --windowed 打包的 exe 退出码不可靠，以报告文件内容为准
          if (-not (Test-Path selfcheck_result.txt)) { Write-Error "自检未生成报告"; exit 1 }
          if (Select-String -Path selfcheck_result.txt -Pattern "FAILED" -Quiet) { Write-Error "自检未通过（见上方报告）"; exit 1 }
          if ($code -ne 0) { Write-Warning "exe 退出码 $code 非零，但自检报告通过，忽略" }

      - name: 失败时回传自检报告（作为 Release 附件）
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path selfcheck_result.txt) {
            gh release upload v0.2.0 selfcheck_result.txt --clobber --repo ${{ github.repository }}
            if ($LASTEXITCODE -ne 0) {
              gh release create v0.2.0 selfcheck_result.txt --title "v0.2.0" --notes "draft assets" --repo ${{ github.repository }}
            }
          }

      - name: 压缩发行包
        run: Compress-Archive -Path dist\Lib_query -DestinationPath Lib_query-windows-x64.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Lib_query-windows-x64
          path: Lib_query-windows-x64.zip

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Lib_query-windows-x64.zip
          generate_release_notes: true

      - name: 清理调试附件
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset v0.2.0 selfcheck_result.txt --yes --repo ${{ github.repository }}
