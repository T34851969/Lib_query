name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller --clean --noconfirm --windowed --name Lib_query main.py

      - name: 冒烟自检（SQLite FTS5）
        run: |
          dist\Lib_query\Lib_query.exe --selfcheck
          if ($LASTEXITCODE -ne 0) { Write-Error "FTS5 自检失败"; exit 1 }

      - name: 压缩发行包
        run: Compress-Archive -Path dist\Lib_query -DestinationPath Lib_query-windows-x64.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Lib_query-windows-x64
          path: Lib_query-windows-x64.zip

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Lib_query-windows-x64.zip
          generate_release_notes: true
