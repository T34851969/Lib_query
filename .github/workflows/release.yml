name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, libq]
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        shell: cmd
        run: scripts\ws2025-build.cmd test

      - name: Publish single-file exe
        shell: cmd
        run: scripts\ws2025-build.cmd publish

      - name: 冒烟自检（Core 全链路；报告文件 + 退出码双重判定）
        shell: pwsh
        run: |
          # pwsh 不等待 GUI 子系统 exe，必须用 Start-Process -Wait 否则立即返回
          try {
            $p = Start-Process -FilePath "dist\LibQuery.exe" -ArgumentList "--selftest" -NoNewWindow -Wait -PassThru
            "exe_exit_code=$($p.ExitCode)" | Set-Content selftest_exit.txt
          } catch {
            $_.Exception.Message | Set-Content selftest_exit.txt
          }
          if (Test-Path selftest_result.txt) { Get-Content selftest_result.txt }
          # 报告内容为准；未生成报告或包含失败标记都算失败
          if (-not (Test-Path selftest_result.txt)) { Write-Error "自检未生成报告（诊断见 selftest_exit.txt）"; exit 1 }
          if (Select-String -Path selftest_result.txt -Pattern "FAIL" -Quiet) { Write-Error "自检未通过（见上方报告）"; exit 1 }

      - name: 失败时回传自检报告（作为 Release 附件）
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'v0.3.0' }
          if (-not (Test-Path selftest_exit.txt)) { "no exit file" | Set-Content selftest_exit.txt }
          $files = @("selftest_exit.txt")
          if (Test-Path selftest_result.txt) { $files += "selftest_result.txt" }
          else { "exe 未生成自检报告（未运行或启动即崩溃）" | Set-Content selftest_marker.txt; $files += "selftest_marker.txt" }
          gh release upload $tag $files --clobber --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $files --title $tag --notes "assets" --repo ${{ github.repository }}
          }

      - name: 压缩发行包
        shell: pwsh
        run: Compress-Archive -Path dist\LibQuery.exe -DestinationPath LibQuery-windows-x64.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LibQuery-windows-x64
          path: LibQuery-windows-x64.zip

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LibQuery-windows-x64.zip
          generate_release_notes: true

      - name: 清理调试附件
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete-asset $env:GITHUB_REF_NAME selftest_result.txt --yes --repo ${{ github.repository }}
          gh release delete-asset $env:GITHUB_REF_NAME selftest_exit.txt --yes --repo ${{ github.repository }}
