[project]
name = "Lib_query"
description = "图书检索工具，支持多种检索方式，基于 PySide6 与 SQLite/FTS5。"
version = "0.2.0"
authors = ["T34851969 <MrImmanual@outlook.com>"]
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "xlsxwriter",
    "python-calamine",
]

[project.optional-dependencies]
build = ["pyinstaller"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
